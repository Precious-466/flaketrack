name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check dist/ is up to date
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "dist/ is out of date. Run 'npm run build' and commit the result."
            git diff --stat dist
            exit 1
          fi

  # Run the Action on its own sample reports, so every change is tested the way users run it.
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: flaketrack
        uses: ./
        with:
          report-paths: test/fixtures/*.xml
      - name: Check outputs
        run: |
          test "${{ steps.flaketrack.outputs.total }}" = "13"
          test "${{ steps.flaketrack.outputs.failed }}" = "4"
